[tool.poetry]
name = "dotter"
version = "0.1.0"
description = ""
authors = ["Oscar Laird <olaird25@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "=3.12.3"
nest-asyncio = "^1.6.0"
torch = "^2.9.1"
fastapi = "^0.121.2"
uvicorn = "^0.38.0"
transformers = "<=4.42"
websockets = "^15.0.1"


[tool.poetry.group.dev.dependencies]
matplotlib = "^3.10.7"
scipy = "^1.16.3"
ipykernel = "^7.1.0"
maturin = ">=1.4,<2"
poethepoet = "^0.40"

[tool.poe.tasks]
# Rebuild/install bayesian into this venv after changing Rust (same as: cd ../bayesian/crates/bayesian && python -m maturin develop).
develop-bayesian = { cmd = "python -m maturin develop", cwd = "../bayesian/crates/bayesian" }

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
