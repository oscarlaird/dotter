[package]
name = "bayesian"
version = "0.1.0"
edition = "2024"

[features]
default = ["python"]
python = ["dep:pyo3"]
wasm = ["dep:wasm-bindgen"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[[bin]]
name = "bayesian"
path = "src/main.rs"

[[bin]]
name = "hybrid_spine_bench"
path = "src/bin/hybrid_spine_bench.rs"
