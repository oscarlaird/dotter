[package]
name = "bayesian"
version = "0.1.0"
edition = "2024"

[features]
default = []
python = ["dep:pyo3"]
wasm = ["dep:wasm-bindgen", "dep:web-sys"]
# stderr tracing for `trie_debug!` / `trie::debug::log` on non-wasm targets
trie-trace = []
tokentrie = []

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console"] }

[[bin]]
name = "bayesian"
path = "src/main.rs"

[[bin]]
name = "hybrid_spine_bench"
path = "src/bin/hybrid_spine_bench.rs"
