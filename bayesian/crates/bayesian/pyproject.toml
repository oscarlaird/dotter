[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "bayesian"
version = "0.1.0"
requires-python = ">=3.9"

[tool.maturin]
features = ["python"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
