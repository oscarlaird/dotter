[package]
name = "bayesian"
version = "0.1.0"
edition = "2024"

[features]
default = ["tokentrie", "proof"]
python = ["dep:pyo3"]
wasm = ["dep:wasm-bindgen", "dep:web-sys", "dep:console_error_panic_hook"]
trie-trace = ["trie/trie-trace"]
tokentrie = ["trie/tokentrie"]
proof = ["trie/proof"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bpe = { path = "../bpe" }
rolling_hash = { path = "../rolling_hash" }
trie = { path = "../trie", default-features = false }
pyo3 = { version = "0.28", features = ["extension-module"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = { version = "0.1", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["console", "Window", "Performance"] }
